<script>
/* =========================

const IMAGE_SYMBOLS = {

  "diamond": 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjSJK24Ir-iXmkb8pncEJl64O01fUc7mWxZcmMLPeFb7kvfK8ilsQO9A0fB31llU_hpP7g8rtyFmI_Qz0nOuYzSr6ryn1isD-8qWlJODGq98gVR4el0VyQBptvK_mfxHLrgMgyjmNwGbelw7XkRb1QmiU3pUNEls-Hi2M5h8eXz8EDnpkcDFZP6ne0GXzqb/s1600/diamon.png'
};

const SYMBOL_KEYS = Object.keys(IMAGE_SYMBOLS);

// --- GAME RULES ---
const PAY_TABLE = {
  "gunting": {3:1,4:2,5:5},
  "kertas": {3:1,4:3,5:10},
  "cutter": {3:2,4:5,5:20},
  "perahu": {3:3,4:10,5:50},
  "kuda": {3:5,4:20,5:100},
  "diamond": {3:2,4:10,5:50}
};

const PAYLINES = [
  [5,6,7,8,9],
  [0,1,2,3,4],
  [10,11,12,13,14],
  [0,6,12,8,4],
  [10,6,2,8,14],
  [5,1,7,13,9],
  [5,11,7,3,9],
  [0,5,10,5,0],
  [4,9,14,9,4]
];

const TOTAL_SLOTS = 15;
const FREE_SPIN_SCATTER_COUNT = 3;
const FREE_SPIN_REWARD = 10;
const BET_STEP = 400;
const BUY_SCATTER_MULTIPLIER = 50;

// DOM refs
const containerEl = document.getElementById('game-container');
const floatingEl = document.getElementById('floatingCharacter');
const slotsEl = document.getElementById("slots");
const balanceEl = document.getElementById("balance");
const betEl = document.getElementById("bet");
const resultEl = document.getElementById("result-message");
const spinButton = document.getElementById("spinButton");
const lightning = document.getElementById("lightning");
const freespinIndicator = document.getElementById("freespin-indicator");
const buyPriceEl = document.getElementById("buy-price");
const buyScatterBtn = document.querySelector('.buy-scatter-btn');
const decreaseBetBtn = document.getElementById("decreaseBetBtn");
const increaseBetBtn = document.getElementById("increaseBetBtn");

const spinSound = document.getElementById("spinSound");
const winSound = document.getElementById("winSound");
const scatterSound = document.getElementById("scatterSound");
const themeSong = document.getElementById("themeSong");

// State
let balance = 100000;
let bet = 400;
let isSpinning = false;
let slotElements = [];
let freeSpins = 0;
let freeSpinMultiplier = 1;
let scatterActive = false;

/* ===== GACOR SCHEDULE (default) ===== */
const SCHEDULE = [
  // 19:00 - 21:59 each day => high gacor
  { name: "Evening Gacor", type: "time", from: "19:00", to: "21:59", bias: { highValueMultiplier: 3 }, jackpotChance: 0.01 },

  // weekend (Sat=6, Sun=0) => medium gacor
  { name: "Weekend Gacor", type: "weekday", days: [6,0], bias: { highValueMultiplier: 2 }, jackpotChance: 0.005 },

  // odd date => light gacor
  { name: "Odd Date Gacor", type: "dateParity", parity: "odd", bias: { highValueMultiplier: 2 }, jackpotChance: 0.002 },
];

function getActiveSchedule(now = new Date()){
  function timeStr(d){ return d.toTimeString().slice(0,5); }
  const curTime = timeStr(now);
  const curDay = now.getDay();
  const curDate = now.getDate();

  for(const s of SCHEDULE){
    if(s.type === "time"){
      if(s.from <= curTime && curTime <= s.to) return s;
    } else if(s.type === "weekday"){
      if(Array.isArray(s.days) && s.days.includes(curDay)) return s;
    } else if(s.type === "dateParity"){
      if(s.parity === "odd" && (curDate % 2 === 1)) return s;
      if(s.parity === "even" && (curDate % 2 === 0)) return s;
    }
  }
  return null;
}

/* GACOR Indicator UI */
let GACOR_INDICATOR = null;
function ensureGacorIndicator(){
  if(GACOR_INDICATOR) return;
  GACOR_INDICATOR = document.createElement('div');
  GACOR_INDICATOR.className = 'gacor-badge';
  GACOR_INDICATOR.style.color = '#ffda00';
  GACOR_INDICATOR.textContent = '';
  (document.getElementById('game-container') || document.body).appendChild(GACOR_INDICATOR);
}
function updateGacorIndicator(){
  ensureGacorIndicator();
  const active = getActiveSchedule();
  if(active){
    GACOR_INDICATOR.textContent = `GACOR MODE: ${active.name}`;
    GACOR_INDICATOR.style.display = 'block';
    GACOR_INDICATOR.style.color = '#ffda00';
  } else {
    GACOR_INDICATOR.textContent = 'NORMAL MODE';
    GACOR_INDICATOR.style.display = 'block';
    GACOR_INDICATOR.style.color = '#fff';
  }
}

/* ========== AUDIO HELPERS ========== */
function stopScatter(){
  try{
    scatterSound.pause();
    scatterSound.currentTime = 0;
    scatterActive = false;
  }catch(e){}
}
function playScatterMusic(){
  try{
    stopTheme();
    scatterSound.loop = true;
    scatterSound.volume = 0.75;

}
function stopTheme(){
  try{ themeSong.pause(); themeSong.currentTime = 0; }catch(e){}
}
function playTheme(){
  if(scatterActive) return;
  try{
    themeSong.loop = true;
    themeSong.volume = 0.45;
    themeSong.play().catch(()=>{});
  }catch(e){}
}
function playEffect(orig, vol=0.9){
  if(!orig) return;
  try{
    const s = orig.cloneNode();
    s.volume = vol;
    s.play().catch(()=>{});
  }catch(e){}
}

/* ===== REPLACE getRandomSymbolKey() (with GACOR bias + FORCE_JACKPOT) ===== */
function getRandomSymbolKey(){
  const active = getActiveSchedule();
  const baseWeights = {
    "gunting": 10,
    "kertas": 10,
    "cutter": 8,
    "perahu": 7,
    "kuda": 5,
    "diamond": 2
  };

  if(active && active.bias && active.bias.highValueMultiplier){
    const m = active.bias.highValueMultiplier || 2;
    baseWeights["kuda"] *= m;
    baseWeights["perahu"] *= m;
    baseWeights["cutter"] *= m;
    // optional minor boost to scatter when gacor - disabled by default
    if(active.bias.boostScatter) baseWeights["diamond"] = Math.max(baseWeights["diamond"], Math.round(baseWeights["diamond"] * (active.bias.boostScatter || 1.5)));
  }

  // Build weighted array
  const weighted = [];
  Object.keys(baseWeights).forEach(k => {
    for(let i=0;i<baseWeights[k];i++) weighted.push(k);
  });

  // jackpot forcing chance when active schedule defines jackpotChance
  const activeJackpotChance = active && typeof active.jackpotChance === 'number' ? active.jackpotChance : 0;
  if(Math.random() < activeJackpotChance){
    return 'FORCE_JACKPOT';
  }

  return weighted[Math.floor(Math.random() * weighted.length)];
}

/* ===== initializeSlots with FORCE_JACKPOT handling ===== */
function initializeSlots(){
  slotsEl.innerHTML = "";
  slotElements = [];

  // Check whether a forced jackpot should happen by calling getRandomSymbolKey once
  let firstPick = getRandomSymbolKey();
  let forceSymbol = null;
  if(firstPick === 'FORCE_JACKPOT'){
    forceSymbol = 'kuda'; // forced jackpot symbol (change if desired)
  }

  for(let i=0;i<TOTAL_SLOTS;i++){
    const div = document.createElement('div');
    div.className = 'slot';
    let symbolKey;
    if(forceSymbol){
      symbolKey = forceSymbol;
    } else {
      if(i===0 && firstPick !== 'FORCE_JACKPOT') symbolKey = firstPick;
      else {
        symbolKey = getRandomSymbolKey();
        if(symbolKey === 'FORCE_JACKPOT'){ symbolKey = 'kuda'; forceSymbol = 'kuda'; }
      }
    }
    div.innerHTML = `<img src="${IMAGE_SYMBOLS[symbolKey]}" alt="${symbolKey}">`;
    div.dataset.symbol = symbolKey;
    slotsEl.appendChild(div);
    slotElements.push(div);
  }
}

/* ===== checkWin (unchanged) ===== */
function checkWin(){
  let totalWin = 0;
  let winningIndices = new Set();
  let scatterCount = 0;
  let scatterIndices = [];

  slotElements.forEach((el, index)=>{
    if(el && el.dataset && el.dataset.symbol === 'diamond'){
      scatterCount++;
      scatterIndices.push(index);
    }
  });

  if(scatterCount >= 3){
    const prizeMultiplier = PAY_TABLE['diamond'][Math.min(scatterCount, 5)];
    if(prizeMultiplier) totalWin += bet * prizeMultiplier;
  }

  PAYLINES.forEach(line=>{
    let currentSymbol='';
    let count=0;
    let lineWinIndices=[];
    for(let i=0;i<line.length;i++){
      const index = line[i];
      if(!slotElements[index]) continue;
      const symbol = slotElements[index].dataset.symbol;

      if(symbol === 'diamond') break; // stop line on scatter

      if(i===0){
        currentSymbol = symbol;
        count = 1;
        lineWinIndices = [index];
      } else if(symbol === currentSymbol){
        count++;
        lineWinIndices.push(index);
      } else break;
    }

    if(count >= 3 && PAY_TABLE[currentSymbol] && PAY_TABLE[currentSymbol][count]){
      const prizeMultiplier = PAY_TABLE[currentSymbol][count];
      const winAmount = bet * prizeMultiplier;
      totalWin += winAmount;
      lineWinIndices.forEach(idx => winningIndices.add(idx));
    }
  });

  if(freeSpins > 0 && totalWin > 0) totalWin *= freeSpinMultiplier;

  return {
    totalReward: totalWin,
    winningIndices: Array.from(winningIndices).concat(scatterCount >= FREE_SPIN_SCATTER_COUNT ? scatterIndices : []),
    scatterTriggered: scatterCount >= FREE_SPIN_SCATTER_COUNT,
    scatterCount: scatterCount
  };
}

/* visuals */
function showLightning(){
  lightning.classList.add('strike');
  setTimeout(()=> lightning.classList.remove('strike') ,400);
}

function enterFreeSpinMode(){
  freeSpins += FREE_SPIN_REWARD;
  freeSpinMultiplier = 3;
  resultEl.innerHTML = `🎉 <strong>${FREE_SPIN_SCATTER_COUNT}+ SCATTER!</strong> Mendapat ${FREE_SPIN_REWARD} Free Spin!`;
  playScatterMusic();
  updateDisplay();
}

/* buy scatter */
function openBuyScatterMenu(){
  const price = calculateBuyScatterPrice();
  if(balance < price){ alert(`Saldo tidak cukup! Diperlukan Rp${price.toLocaleString('id-ID')}. Saldo Anda: Rp${balance.toLocaleString('id-ID')}`); return; }

  const isConfirmed = confirm(`Beli ${FREE_SPIN_REWARD} Free Spin dengan harga Rp${price.toLocaleString('id-ID')}?`);
  if(isConfirmed){
    balance -= price;
    enterFreeSpinMode();
    updateDisplay();
    setTimeout(()=>startSpin(),800);
  } else {
    stopScatter();
    playTheme();
  }
}

/* start spin */
async function startSpin(){
  if(isSpinning) return;

  slotElements.forEach(el => el.classList.remove('highlight'));
  playEffect(spinSound, 0.9);

  if(freeSpins === 0){
    if(balance < bet){ resultEl.textContent = "Saldo tidak cukup!"; playTheme(); return; }
    isSpinning = true;
    spinButton.disabled = true;
    resultEl.textContent = "Stiker berputar...";
    balance -= bet;
    initializeSlots();
    await new Promise(r=>setTimeout(r,520));
  } else {
    isSpinning = true;
    spinButton.disabled = true;
    resultEl.textContent = `Free Spin... ${freeSpins} tersisa.`;
    freeSpins--;
    initializeSlots();
    await new Promise(r=>setTimeout(r,520));
  }

  updateDisplay();

  const spinResult = checkWin();
  let totalWin = spinResult.totalReward;

  if(totalWin > 0){
    spinResult.winningIndices.forEach(index=>{
      if(slotElements[index]) slotElements[index].classList.add('highlight');
    });
    showLightning();

    if(spinResult.scatterTriggered){
      enterFreeSpinMode();
    } else {
      playEffect(winSound, 0.9);
    }

    let finalMessage = `💰 <strong>MENANG!</strong> +${totalWin.toLocaleString('id-ID')}`;
    if(freeSpins > 0 || spinResult.scatterTriggered) finalMessage = `✨ KEMENANGAN Free Spin (X${freeSpinMultiplier}) +${totalWin.toLocaleString('id-ID')}`;

    resultEl.innerHTML = finalMessage;
    balance += totalWin;
  } else {
    resultEl.textContent = "💔 Belum beruntung. Coba lagi!";
  }

  isSpinning = false;
  spinButton.disabled = false;

  if(freeSpins > 0){
    await new Promise(r=>setTimeout(r,1200));
    startSpin();
  } else {
    if(scatterActive){
      stopScatter();
      setTimeout(()=>playTheme(), 200);
    } else {
      playTheme();
    }
  }

  updateDisplay();
}

/* controls */
function increaseBet(){ if(!isSpinning && (bet + BET_STEP) <= balance){ bet += BET_STEP; updateDisplay(); } }
function decreaseBet(){ if(!isSpinning && bet > BET_STEP){ bet -= BET_STEP; updateDisplay(); } }

function calculateBuyScatterPrice(){ return bet * BUY_SCATTER_MULTIPLIER; }

/* UI update */
function updateDisplay(){
  balanceEl.textContent = balance.toLocaleString('id-ID');
  betEl.textContent = bet.toLocaleString('id-ID');
  buyPriceEl.textContent = calculateBuyScatterPrice().toLocaleString('id-ID');
  buyScatterBtn.disabled = isSpinning || balance < calculateBuyScatterPrice();

  if(freeSpins>0){
    spinButton.textContent = `FREE SPIN (${freeSpins})!`;
    decreaseBetBtn.disabled = true;
    increaseBetBtn.disabled = true;
  } else {
    spinButton.textContent = "🎲 SPIN";
    decreaseBetBtn.disabled = isSpinning || bet <= BET_STEP;
    increaseBetBtn.disabled = isSpinning || (bet + BET_STEP) > balance;
  }
  spinButton.disabled = isSpinning || (freeSpins===0 && balance < bet);

  if(freeSpins>0){
    freespinIndicator.style.display = 'block';
    freespinIndicator.textContent = `FREE SPIN: ${freeSpins} tersisa! (X${freeSpinMultiplier})`;
    containerEl.classList.add('freespin-mode');
  } else {
    freespinIndicator.style.display = 'none';
    containerEl.classList.remove('freespin-mode');
  }

  updateGacorIndicator();
}

/* preload images */
function preloadImages(imageUrls){ imageUrls.forEach(url=>{ const i = new Image(); i.src = url; }); }
const allImageUrls = Object.values(IMAGE_SYMBOLS);
if(floatingEl && floatingEl.src) allImageUrls.push(floatingEl.src);
preloadImages(allImageUrls);

/* layout helper: floating positioning desktop vs mobile */
function positionFloating(){
  const w = window.innerWidth;
  if(w >= 769){
    const rect = containerEl.getBoundingClientRect();
    const docScrollTop = window.scrollY || document.documentElement.scrollTop;
    floatingEl.style.position = 'absolute';
    floatingEl.style.transform = '';
    floatingEl.style.top = (rect.top + docScrollTop) + 'px';
    const spaceRight = window.innerWidth - (rect.right);
    if(spaceRight > 220){
      floatingEl.style.left = (rect.right + 12) + 'px';
    } else {
      floatingEl.style.left = (rect.right - 120) + 'px';
    }
    floatingEl.style.height = '60vh';
    floatingEl.style.zIndex = '30';
    containerEl.style.zIndex = '20';
  } else {
    floatingEl.style.position = 'fixed';
    floatingEl.style.left = '50%';
    floatingEl.style.top = '6vh';
    floatingEl.style.transform = 'translateX(-50%)';
    floatingEl.style.height = '45vh';
    floatingEl.style.zIndex = '10';
    containerEl.style.zIndex = '20';
  }
}

/* initialize on load */
function initializeSlotsOnLoad(){
  initializeSlots();
  updateDisplay();
  positionFloating();
  // try autoplay theme per request (may be blocked until user interaction)
  try{ themeSong.play().catch(()=>{}); }catch(e){}
}

/* respond to resize/scroll */
window.addEventListener('resize', ()=>{ positionFloating(); updateGacorIndicator(); });
window.addEventListener('scroll', ()=>{ if(window.innerWidth >= 769) positionFloating(); });

/* start */
initializeSlotsOnLoad();

// start theme on first interaction if blocked
function enableAudioOnInteraction(){
  try{
    if(!scatterActive) themeSong.play().catch(()=>{});
  }catch(e){}
  document.body.removeEventListener('click', enableAudioOnInteraction);
  document.body.removeEventListener('touchend', enableAudioOnInteraction);
}
document.body.addEventListener('click', enableAudioOnInteraction);
document.body.addEventListener('touchend', enableAudioOnInteraction);

/* expose functions for inline onclicks */
window.startSpin = startSpin;
window.openBuyScatterMenu = openBuyScatterMenu;
window.increaseBet = increaseBet;
window.decreaseBet = decreaseBet;
</script>
</body>
</html>
